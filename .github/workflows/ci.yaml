name: ci
on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Rules regenerate cleanly from the specs, are valid, pass the burn-rate
    # tests, and the tests catch deliberately broken SLOs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make verify

  e2e:
    # Real Prometheus + Alertmanager: inject errors, expect a page.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
      - if: failure()
        run: docker compose logs prometheus alertmanager --tail=100
      - if: always()
        run: make down
