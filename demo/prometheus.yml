global:
  scrape_interval: 5s
  evaluation_interval: 5s   # demo speed; production usually 30s-1m
rule_files:
  - /etc/prometheus/rules/*.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: checkout
    static_configs:
      - targets: ["app:8080"]
